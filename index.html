<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>豆包用户口碑分析</title>
<style>
:root{--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f8fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 36px;max-width:520px;text-align:center}
h1{font-size:20px;margin:0 0 10px;font-weight:600;letter-spacing:-.2px}
p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
a.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600}
a.alt{display:block;margin-top:14px;color:var(--muted);font-size:12.5px;text-decoration:none}
a.alt:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="card">
  <h1>豆包用户口碑分析报告</h1>
